<!doctype html>
<!-- The link-preview image (site/og/sentryscreen-og.png, 1200x630) and the
     home-screen icon (site/apple-touch-icon.png, 180x180). Rendered by
     design/build-og.sh; not deployed. The drawings are read from the built
     pages, so they always match the site. Everything that must survive a
     square crop sits in the middle 630 px. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../site/styles.css" />
<style>
  @font-face {
    font-family: "Shantell Sans";
    font-weight: 700;
    src: url("../site/fonts/shantell-sans-700.woff2") format("woff2");
  }
  html, body { margin: 0; background: var(--wall); overflow: hidden; }
  .og-card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: radial-gradient(90% 85% at 50% 42%, #3a2b20 0%, transparent 70%), var(--wall);
  }
  .og-stars {
    position: absolute;
    inset: 0;
    background: var(--star);
    -webkit-mask: url("../site/art/stars.svg") 0 0 / 148px 148px repeat;
    mask: url("../site/art/stars.svg") 0 0 / 148px 148px repeat;
  }
  .og-floor {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 122px;
    background: var(--c-wood, #6b4a33);
    border-top: 4px solid var(--ink-line);
  }
  .og-copy {
    position: absolute;
    left: 50%;
    top: 40px;
    width: 640px;
    transform: translateX(-50%);
    text-align: center;
    color: var(--ink);
  }
  .og-brand {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--display);
    font-size: 30px;
    color: var(--ink);
  }
  .og-brand svg { width: 44px; height: 44px; }
  .swash::after {
    -webkit-mask-image: url("../site/art/swash.svg");
    mask-image: url("../site/art/swash.svg");
  }
  h1 {
    margin: 26px 0 0;
    font-family: var(--display);
    font-size: 58px;
    line-height: 1.12;
    letter-spacing: 0;
  }
  .og-note {
    display: inline-block;
    margin-top: 30px;
    padding: 10px 26px;
    border: 3px solid var(--ink-line);
    border-radius: var(--r-pill);
    background: var(--c-mustard);
    color: #2b1d16;
    font-family: var(--display);
    font-size: 26px;
    box-shadow: 3px 4px 0 var(--ink-line);
  }
  .og-lantern { position: absolute; left: 48px; bottom: 16px; width: 250px; height: 235px; }
  .og-desk {
    position: absolute; right: 0; bottom: 0; z-index: 1; width: 340px; height: 281px;
    /* Soft top and left edges, so the lamp light fades into the wall. */
    -webkit-mask: linear-gradient(to right, transparent, #000 22%), linear-gradient(to bottom, transparent, #000 22%);
    -webkit-mask-composite: source-in;
    mask: linear-gradient(to right, transparent, #000 22%), linear-gradient(to bottom, transparent, #000 22%);
    mask-composite: intersect;
  }
  .og-desk { overflow: hidden; }
  .og-lantern svg, .og-desk svg { position: static; display: block; width: 100%; height: 100%; overflow: hidden; }
  /* The home-screen icon: Lantern's face on the night wall. */
  .og-icon { width: 180px; height: 180px; display: grid; place-items: center; background: #2a1f18; }
  .og-icon svg { width: 140px; height: 140px; }
</style>
</head>
<body>
<div class="og-card" id="og-card">
  <div class="og-stars"></div>
  <div class="og-desk" id="og-desk"></div>
  <div class="og-floor"></div>
  <div class="og-lantern" id="og-lantern"></div>
  <div class="og-copy">
    <div class="og-brand" id="og-brand">SentryScreen</div>
    <h1>Explicit content on your Mac, <span class="swash">covered</span> the moment it appears.</h1>
    <div class="og-note">Free &middot; open source &middot; for Mac</div>
  </div>
</div>
<script>
  // Lift a drawing out of a built page by its <!-- fig:NAME --> marker.
  const fig = (html, name) => html.split(`<!-- fig:${name} -->`)[1].split("<!-- /fig -->")[0];
  Promise.all(["../site/support/index.html", "../site/index.html"].map((u) => fetch(u).then((r) => r.text()))).then(([support, home]) => {
    const mark = fig(home, "mark");
    if (location.hash === "#icon") {
      document.body.innerHTML = `<div class="og-icon">${mark}</div>`;
      return;
    }
    document.getElementById("og-brand").insertAdjacentHTML("afterbegin", mark);
    document.getElementById("og-lantern").innerHTML = fig(support, "lantern-wave");
    // The room's desk and screen, cropped out of the hero drawing.
    const scene = home.split("<!-- hero-scene:start -->")[1].split("<!-- hero-scene:end -->")[0];
    const desk = document.getElementById("og-desk");
    desk.innerHTML = scene.replace(/viewBox="[^"]*" preserveAspectRatio="[^"]*"/, 'viewBox="330 175 540 447" preserveAspectRatio="xMidYMax meet"');
    document.documentElement.classList.add("ready");
  });
</script>
</body>
</html>
